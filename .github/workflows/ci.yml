name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, build and unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check server
        run: npx tsc --noEmit

      - name: Type-check web
        run: npx tsc --noEmit -p web/tsconfig.json

      - name: Build server
        run: npm run build

      - name: Build web
        run: npm run web:build

      - name: Run unit tests
        run: npm run test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.9
        env:
          POSTGRES_USER: recovery
          POSTGRES_PASSWORD: recovery_dev
          POSTGRES_DB: recovery
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recovery -d recovery"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
      redis:
        image: redis:7.4.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    env:
      DATABASE_URL: postgres://recovery_app:recovery_dev@localhost:5432/recovery
      ADMIN_DATABASE_URL: postgres://recovery:recovery_dev@localhost:5432/recovery
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply schema
        run: psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql

      - name: Run all tests
        run: npm test
