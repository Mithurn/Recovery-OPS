name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check server
        run: npx tsc --noEmit

      - name: Type-check web
        run: npx tsc --noEmit -p web/tsconfig.json

      - name: Build web
        run: npm run web:build

      - name: Run unit tests
        # test:unit excludes *.integration.test.ts — no Postgres, Redis, or model API needed.
        run: npm run test:unit
