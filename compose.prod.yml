x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://recovery_app:${APP_DB_PASSWORD}@postgres:5432/recovery
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 120s
    logging: *logging
    restart: unless-stopped

  migrate:
    build: .
    command: ["node", "dist/scripts/migrate.js"]
    env_file: .env
    environment:
      ADMIN_DATABASE_URL: postgres://recovery:${ADMIN_DB_PASSWORD}@postgres:5432/recovery
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    logging: *logging
    restart: "no"

  postgres:
    image: postgres:16.9
    environment:
      POSTGRES_USER: recovery
      POSTGRES_PASSWORD: ${ADMIN_DB_PASSWORD}
      POSTGRES_DB: recovery
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./db/app-role.sh:/docker-entrypoint-initdb.d/20-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recovery -d recovery"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    cpus: 1.0
    logging: *logging
    restart: unless-stopped

  redis:
    image: redis:7.4.4
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    cpus: 0.5
    logging: *logging
    restart: unless-stopped

  caddy:
    image: caddy:2.10.0
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - app
    mem_limit: 256m
    cpus: 0.5
    logging: *logging
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddydata:
